<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>HN Browser</title><link rel="stylesheet" href="shell.css"><script defer src="shell.js"></script></head><body data-theme="midnight-lavender"><div class="browser-top"><div class="tabs-row"><img class="brand-mark" src="assets/favicon.svg" alt="HN Browser"><div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new-tab" title="New tab (Ctrl or Command + T)" aria-label="New tab">＋</button><div class="window-label">HN BROWSER <span>PREVIEW</span></div></div><div class="toolbar"><div class="navigation"><button id="back" title="Back" aria-label="Back">←</button><button id="forward" title="Forward" aria-label="Forward">→</button><button id="reload" title="Reload" aria-label="Reload">↻</button><button id="home" title="New tab page" aria-label="Home">⌂</button></div><form id="address-form"><span id="connection" aria-label="Connection">◇</span><input id="address" aria-label="Address or search" placeholder="Search the web or enter an address" autocomplete="off" spellcheck="false"><span class="address-hint">↵</span></form><label class="theme-label"><span>Theme</span><select id="theme" aria-label="Browser theme"><option value="midnight-lavender">Midnight Lavender</option><option value="daylight">Daylight</option><option value="deep-ocean">Deep Ocean</option><option value="forest">Forest</option><option value="rose">Rose Quartz</option></select></label><button class="account-button" id="account" aria-expanded="false"><span id="initials">♙</span><span id="account-label">HN account</span><span>⌄</span></button></div><div class="bookmark-bar"><button data-link="https://hngroup.org.uk">HN Group</button><button data-link="https://staff.hngroup.org.uk">Staff portal</button><button data-link="https://links.hngroup.org.uk">Group links ↗</button><button data-link="https://downloads.hngroup.org.uk">Downloads</button><span id="page-error" role="status"></span><span id="version"></span></div><div class="stripe"></div></div><section id="profile" class="profile" hidden><p class="eyebrow">YOUR HN ACCOUNT</p><h1 id="profile-name">Make yourself at home.</h1><p id="profile-details">Sign in with your existing HN Group account.</p><p class="profile-note">Your account stays separate from the websites you visit. HN website sign-ins still use their usual permissions and PIN.</p><button id="sign-in" class="primary">Sign in to HN Group →</button><button id="sign-out" hidden>Sign out of HN Browser</button></section><div id="notice" role="status" hidden></div></body></html>
