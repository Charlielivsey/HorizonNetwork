server {
    listen 80;
    listen [::]:80;
    server_name roster.hngroup.org.uk;
    include /etc/nginx/hn-offline/enabled/*.conf;
    include /etc/nginx/hn-control/enabled/roster-*.conf;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-roster-acme; default_type text/plain; }
    location / {
        proxy_pass http://127.0.0.1:5730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }
}
