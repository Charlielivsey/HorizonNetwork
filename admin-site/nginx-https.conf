server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.hngroup.org.uk;

    ssl_certificate /etc/letsencrypt/live/admin.hngroup.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.hngroup.org.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-admin-acme; default_type text/plain; }
    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-HN-Control-Key "";
        proxy_set_header X-HN-Control-Render "";
        proxy_set_header X-HN-Control-Site "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
