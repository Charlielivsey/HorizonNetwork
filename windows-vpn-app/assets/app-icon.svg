<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="HN Group VPN">
  <title>HN Group VPN</title>
  <!-- HN Group VPN app icon: the HN Group app-icon style (HN purple, white outline, geometric
       monogram) with a shield for the VPN, on the macOS icon grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B24D6"/>
      <stop offset="1" stop-color="#4A0E9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1C2135" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#25064F" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <!-- The design, in the 100-unit grid of the approved company icons. -->
  <g transform="translate(130 130) scale(7.64)" filter="url(#soft)">
    <!-- Shield -->
    <path d="M50 8.5 83.5 20.5V46c0 22.5-14.2 38.4-33.5 46.5C30.7 84.4 16.5 68.5 16.5 46V20.5Z" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/>
    <!-- HN monogram, drawn like the company icons' letters -->
    <g transform="translate(29.3 29.5) scale(0.8)" fill="#FFFFFF">
      <path d="M0 0h7.8v13.45h8.4V0h7.8v34.3h-7.8v-13.45h-8.4v13.45H0z"/>
      <path transform="translate(26.8 0)" d="M0 0h7.6l9.6 19.2V0h7.8v34.3h-7.6L7.8 15.1v19.2H0z"/>
    </g>
    <!-- The HN stripe -->
    <g transform="translate(29.3 63.5)">
      <rect x="0" y="0" width="6.2" height="2.6" fill="#E97DE8"/>
      <rect x="6.2" y="2.6" width="6.2" height="2.6" fill="#B794F6"/>
      <rect x="12.4" y="0" width="2.6" height="2.6" fill="#E3E65B"/>
      <rect x="15" y="2.6" width="8.8" height="2.6" fill="#3E9BA3"/>
      <rect x="23.8" y="0" width="4.4" height="2.6" fill="#E97DE8"/>
      <rect x="28.2" y="2.6" width="4.4" height="2.6" fill="#C2306B"/>
      <rect x="32.6" y="0" width="5.6" height="2.6" fill="#5FAE7B"/>
      <rect x="38.2" y="2.6" width="3.2" height="2.6" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
