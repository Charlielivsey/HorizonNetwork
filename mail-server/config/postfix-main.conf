# HN Group mail server: Postfix settings, applied one by one with `postconf -e` by mail-server/install.sh
# (the original main.cf is kept as main.cf.before-hn-mail). Lines starting with # are ignored.
myhostname = mx.hngroup.org.uk
mydomain = hngroup.org.uk
myorigin = $myhostname
mydestination = localhost
inet_interfaces = all
inet_protocols = ipv4
mynetworks = 127.0.0.0/8
mynetworks_style = host
smtpd_banner = $myhostname ESMTP
biff = no
append_dot_mydomain = no
readme_directory = no
compatibility_level = 3.6
alias_maps = hash:/etc/aliases
alias_database = hash:/etc/aliases
# Hosted domains, mailboxes, aliases and groups: from the mail directory (admin.mail.hngroup.org.uk).
virtual_mailbox_domains = texthash:/etc/hn-mail/postfix/domains
virtual_mailbox_maps = texthash:/etc/hn-mail/postfix/mailboxes
virtual_alias_maps = texthash:/etc/hn-mail/postfix/aliases
virtual_transport = lmtp:unix:private/dovecot-lmtp
recipient_delimiter = +
# Who may send as which address (checked for every signed-in sender, and outside servers may not use our addresses
# without signing in). Shared mailboxes' sent mail is also filed in their shared Sent folder.
smtpd_sender_login_maps = texthash:/etc/hn-mail/postfix/senders
sender_bcc_maps = texthash:/etc/hn-mail/postfix/sender-bcc
# Forwarding to outside addresses keeps working with SPF (SRS through postsrsd).
sender_canonical_maps = tcp:127.0.0.1:10001
sender_canonical_classes = envelope_sender
recipient_canonical_maps = tcp:127.0.0.1:10002
recipient_canonical_classes = envelope_recipient, header_recipient
# TLS
smtpd_tls_cert_file = /etc/hn-mail/tls/fullchain.pem
smtpd_tls_key_file = /etc/hn-mail/tls/privkey.pem
smtpd_tls_security_level = may
smtpd_tls_auth_only = yes
smtpd_tls_mandatory_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1
smtpd_tls_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1
smtpd_tls_loglevel = 1
smtpd_tls_received_header = yes
smtpd_tls_session_cache_database = btree:${data_directory}/smtpd_scache
smtp_tls_security_level = may
smtp_tls_loglevel = 1
smtp_tls_CApath = /etc/ssl/certs
smtp_tls_session_cache_database = btree:${data_directory}/smtp_scache
# Signing in, through Dovecot.
smtpd_sasl_type = dovecot
smtpd_sasl_path = private/auth
# Sign-in is also offered on port 25 (only after TLS): Postfix only checks who owns a sender address where sign-in is
# enabled, and that check is what stops outside servers from sending as our addresses.
smtpd_sasl_auth_enable = yes
smtpd_sasl_security_options = noanonymous
smtpd_sasl_authenticated_header = no
# Port 25 (mail from the internet): only for our own domains, never an open relay.
smtpd_helo_required = yes
disable_vrfy_command = yes
strict_rfc821_envelopes = yes
smtpd_delay_reject = yes
smtpd_client_restrictions = permit_mynetworks, permit_sasl_authenticated, reject_unknown_reverse_client_hostname
smtpd_helo_restrictions = permit_sasl_authenticated, reject_invalid_helo_hostname, reject_non_fqdn_helo_hostname
smtpd_sender_restrictions = reject_non_fqdn_sender, reject_unknown_sender_domain, reject_unauthenticated_sender_login_mismatch
smtpd_relay_restrictions = permit_sasl_authenticated, reject_unauth_destination
smtpd_recipient_restrictions = reject_non_fqdn_recipient, reject_unknown_recipient_domain, check_recipient_access regexp:/etc/hn-mail/postfix/recipient-access, permit_sasl_authenticated, reject_unauth_destination, check_policy_service inet:127.0.0.1:12340
smtpd_data_restrictions = reject_unauth_pipelining
smtpd_error_sleep_time = 2s
smtpd_soft_error_limit = 5
smtpd_hard_error_limit = 10
smtpd_client_connection_rate_limit = 60
smtpd_client_message_rate_limit = 300
smtpd_client_recipient_rate_limit = 600
anvil_rate_time_unit = 3600s
# Spam checks and DKIM signatures (Rspamd).
smtpd_milters = inet:127.0.0.1:11332
non_smtpd_milters = inet:127.0.0.1:11332
milter_protocol = 6
milter_default_action = accept
milter_mail_macros = i {mail_addr} {client_addr} {client_name} {auth_authen}
# Sizes: 35 MB per message (about 25 MB of attachments); mailbox sizes are Dovecot quotas.
message_size_limit = 36700160
mailbox_size_limit = 0
# Delivery: retry for 5 days before returning a message to its sender, with a delay warning after 4 hours.
maximal_queue_lifetime = 5d
bounce_queue_lifetime = 5d
delay_warning_time = 4h
default_destination_rate_delay = 0s
smtp_destination_concurrency_limit = 10
notify_classes = resource, software
