# HN Group mail server: Dovecot 2.4 (Ubuntu 26.04 and later). The same behaviour as dovecot.conf (Dovecot 2.3) in
# Dovecot 2.4's settings format; mail-server/install.sh picks the one for the installed version. Written by the
# installer (the original /etc/dovecot/dovecot.conf is kept as dovecot.conf.before-hn-mail). Mailboxes, users and
# permissions come from the mail directory on admin.mail.hngroup.org.uk (files in /etc/hn-mail/dovecot/, re-read when
# they change).
dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.2

protocols = imap lmtp
listen = *
log_path = syslog
syslog_facility = mail
# Never log passwords or message contents.
auth_verbose = yes
auth_verbose_passwords = no

# ---- Storage: one Maildir per mailbox, /var/vmail/<mailbox id> (never moves when an address changes) ----
mail_driver = maildir
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_privileged_group = vmail
mailbox_list_index = yes
mail_plugins {
  quota = yes
  acl = yes
}

namespace inbox {
  type = private
  separator = /
  prefix =
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    autoexpunge = 30d
    quota_storage_extra = 64M
  }
}
# Shared mailboxes: members see them under Shared/<address>/ with exactly the rights the mail directory gives them.
# Read/unread state is shared by the team.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/$user/
  mail_driver = maildir
  mail_path = %{owner_home}/Maildir
  subscriptions = no
  list = children
}

# ---- Sign-in: no mailbox passwords; HN Mail's private master login or revocable app passwords ----
auth_allow_cleartext = no
auth_mechanisms = plain login
auth_master_user_separator = *
auth_username_format = %{user | lower}
auth_failure_delay = 2 secs

passdb denied {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/denied
  deny = yes
}
passdb masters {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/master-users
  default_password_scheme = SHA512-CRYPT
  master = yes
  # The mailbox being opened must also pass the normal checks below (exists, not disabled).
  result_success = continue
}
passdb targets {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/master-target
}
# Mail app passwords (Outlook, Apple Mail, phones): up to 10 per mailbox, one per file, salted SHA-512 of a random
# 20-character password (made by HN Mail, never chosen by people), so a fast hash is enough.
passdb app1 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-1
}
passdb app2 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-2
}
passdb app3 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-3
}
passdb app4 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-4
}
passdb app5 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-5
}
passdb app6 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-6
}
passdb app7 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-7
}
passdb app8 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-8
}
passdb app9 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-9
}
passdb app10 {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/app-10
}
userdb mailboxes {
  driver = passwd-file
  passwd_file_path = /etc/hn-mail/dovecot/users
  fields {
    uid = vmail
    gid = vmail
  }
}

# ---- TLS ----
ssl = required
ssl_server_cert_file = /etc/hn-mail/tls/fullchain.pem
ssl_server_key_file = /etc/hn-mail/tls/privkey.pem
ssl_min_protocol = TLSv1.2

service imap-login {
  inet_listener imap {
    listen = 127.0.0.1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 2
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}
service auth-worker {
  user = root
}
service quota-status {
  executable = quota-status -p postfix
  inet_listener quota-status {
    listen = 127.0.0.1
    port = 12340
  }
  client_limit = 1
}
service stats {
  unix_listener stats-writer {
    mode = 0660
    group = vmail
  }
}

protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_acl = yes
  }
  mail_max_userip_connections = 40
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
  postmaster_address = postmaster@hngroup.org.uk
}
recipient_delimiter = +
lmtp_save_to_detail_mailbox = no
lmtp_rcpt_check_quota = yes
# A full mailbox never loses mail: delivery is refused for now and the sending server retries.
quota_full_tempfail = yes

# Every mailbox's limit comes from the mail directory (1 GB unless an administrator changed it).
# The default limit is set here (not inside the quota block) so each mailbox's own limit from the users file
# (quota_storage_size) replaces it.
quota_storage_size = 1G
quota_storage_grace = 10M
quota "Mailbox storage" {
  driver = count
  warning warn-100 {
    quota_storage_percentage = 100
    execute quota-warning {
      args = 100 %{user}
    }
  }
  warning warn-90 {
    quota_storage_percentage = 90
    execute quota-warning {
      args = 90 %{user}
    }
  }
}
quota_status_success = DUNNO
quota_status_nouser = DUNNO
quota_status_overquota = "452 4.2.2 This mailbox is full. Your message has not been lost: your mail server will keep trying to deliver it"
service quota-warning {
  executable = script /usr/local/lib/hn-mail/quota-warning
  user = vmail
  unix_listener quota-warning {
    user = vmail
    mode = 0600
  }
}

acl_driver = vfile
# Rights are those of the mailbox being opened, also when HN Mail opens it with its master login.
acl_user = %{user}
acl_sharing_map {
  dict file {
    path = /var/vmail/.hn-shared-mailboxes.db
  }
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
sieve_script before {
  type = before
  driver = file
  path = /etc/hn-mail/sieve/before.sieve
}
