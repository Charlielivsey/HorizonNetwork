# HN Group mail: every message sent by a signed-in mailbox is signed with its From domain's own key
# (hngroup.org.uk, horizon-network.co.uk, horizonadvertising.co.uk, media.hngroup.org.uk, network.hngroup.org.uk).
# Private keys stay in /var/lib/rspamd/dkim (made by mail-server/install.sh, never in Git).
enabled = true;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector = "hn2026";
use_domain = "header";
use_esld = false;
allow_username_mismatch = true;
allow_hdrfrom_mismatch = false;
sign_authenticated = true;
sign_local = false;
try_fallback = false;
