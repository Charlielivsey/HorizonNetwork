# HN Group mail: probable spam is delivered to Junk (X-Spam header, see /etc/hn-mail/sieve/before.sieve); only very
# obvious spam is refused at the door, so the sender is told. Nothing is silently dropped. The scores are set on
# admin.mail.hngroup.org.uk (written to /etc/hn-mail/rspamd/actions.inc).
reject = 15;
add_header = 6;
greylist = null;
.include(try=true; priority=10) "/etc/hn-mail/rspamd/actions.inc"
