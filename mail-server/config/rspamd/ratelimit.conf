# HN Group mail: how much each signed-in mailbox may send (an administrator can change it on admin.mail.hngroup.org.uk,
# which writes /etc/hn-mail/rspamd/ratelimit-user.inc). A runaway or stolen app password can't send thousands of emails.
rates {
  .include(try=true; priority=10) "/etc/hn-mail/rspamd/ratelimit-user.inc"
}
