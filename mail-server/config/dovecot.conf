# HN Group mail server: Dovecot (IMAP, LMTP delivery, quotas, shared mailboxes, sieve). Written by
# mail-server/install.sh (the original /etc/dovecot/dovecot.conf is kept as dovecot.conf.before-hn-mail).
# Mailbox data, users and permissions come from the mail directory managed on admin.mail.hngroup.org.uk, which writes
# the files in /etc/hn-mail/dovecot/ (Dovecot re-reads them when they change).

protocols = imap lmtp
listen = *
log_path = syslog
syslog_facility = mail
# Never log passwords or message contents; failed logins are logged with the user name only.
auth_verbose = yes
auth_verbose_passwords = no
auth_debug = no
mail_debug = no

# ---- Mail storage: one Maildir per mailbox, under /var/vmail/<mailbox id> (the id never changes, so renaming a
# mailbox's address never moves its mail) ----
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_privileged_group = vmail
mail_plugins = quota acl
mailbox_list_index = yes
mail_attribute_dict = file:%h/Maildir/dovecot-attributes

namespace inbox {
  type = private
  separator = /
  prefix =
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    autoexpunge = 30d
  }
}

# Shared mailboxes (billing@, enquiries@ …) are real mailboxes; members see them under Shared/<address>/ with exactly
# the rights the mail directory gives them (Dovecot checks them on every command). Read/unread state is shared, so the
# whole team sees which messages have been dealt with.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h/Maildir
  subscriptions = no
  list = children
}

# ---- Sign-in ----
# Mailboxes have no passwords of their own. People open them with HN Mail (through HN Group Auth; HN Mail signs in to
# Dovecot as their own mailbox with its private master login) or with a mail app password they create in HN Mail
# (revocable, stored only as scrypt hashes). Nobody shares a password; shared mailboxes can't be signed in to directly.
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_master_user_separator = *
auth_username_format = %Lu
auth_failure_delay = 2 secs

# Disabled mailboxes (and mailboxes whose staff accounts are all disabled): no sign-in at all, mail is kept.
passdb {
  driver = passwd-file
  args = /etc/hn-mail/dovecot/denied
  deny = yes
}
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /etc/hn-mail/dovecot/master-users
  master = yes
  # The mailbox being opened must also pass the normal checks below (exists, not disabled).
  pass = yes
}
# Every enabled mailbox, with a password nobody can match: only there so master logins can find the mailbox.
passdb {
  driver = passwd-file
  args = /etc/hn-mail/dovecot/master-target
}
passdb {
  driver = checkpassword
  args = /usr/local/lib/hn-mail/checkpassword
}
userdb {
  driver = passwd-file
  args = username_format=%Lu /etc/hn-mail/dovecot/users
  default_fields = uid=vmail gid=vmail
}

# ---- TLS: IMAP only over TLS from outside (993); HN Mail talks to 127.0.0.1:143 ----
ssl = required
ssl_cert = </etc/hn-mail/tls/fullchain.pem
ssl_key = </etc/hn-mail/tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 2
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}
service auth-worker {
  user = root
}
# Postfix asks this before accepting mail, so a full mailbox is refused politely at the door (the sender's server
# keeps the message and tries again) instead of being accepted and lost.
service quota-status {
  executable = quota-status -p postfix
  inet_listener {
    address = 127.0.0.1
    port = 12340
  }
  client_limit = 1
}
service stats {
  unix_listener stats-writer {
    mode = 0660
    group = vmail
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota imap_acl
  mail_max_userip_connections = 40
  imap_idle_notify_interval = 2 mins
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@hngroup.org.uk
}
recipient_delimiter = +
lmtp_save_to_detail_mailbox = no
lmtp_rcpt_check_quota = yes
# A full mailbox never loses mail: delivery is refused for now and the sending server retries.
quota_full_tempfail = yes

plugin {
  quota = count:Mailbox storage
  quota_vsizes = yes
  # Every mailbox's limit comes from the mail directory (1 GB unless an administrator changed it).
  quota_rule = *:storage=1024M
  quota_rule2 = Trash:storage=+64M
  quota_grace = 5%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "452 4.2.2 This mailbox is full. Your message has not been lost: your mail server will keep trying to deliver it"
  quota_warning = storage=90%% quota-warning 90 %u
  quota_warning2 = storage=100%% quota-warning 100 %u

  acl = vfile
  acl_shared_dict = file:/var/lib/dovecot/hn-shared-mailboxes.db
  acl_anyone = forbid

  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_before = /etc/hn-mail/sieve/before.sieve
  sieve_extensions = +imapflags
}
service quota-warning {
  executable = script /usr/local/lib/hn-mail/quota-warning
  user = vmail
  unix_listener quota-warning {
    user = vmail
    mode = 0600
  }
}
