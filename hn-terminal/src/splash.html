<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HN Secure Enclave</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0c0c0c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 0%, #38bdf8 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 12px;
            color: #555;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .loader {
            width: 120px;
            height: 2px;
            background: #1a1a2e;
            border-radius: 1px;
            overflow: hidden;
        }
        .loader-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #38bdf8);
            border-radius: 1px;
            animation: load 1.2s ease-in-out infinite;
        }
        @keyframes load {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        .version {
            position: absolute;
            bottom: 16px;
            font-size: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="logo">HN</div>
    <div class="subtitle">Secure Enclave</div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="version">v1.2.0 — Horizon Network</div>
</body>
</html>
