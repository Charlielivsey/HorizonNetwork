<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN Secure Enclave</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="titlebar">
        <div class="titlebar-brand">
            <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="1" y="1" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <text x="8" y="11.2" text-anchor="middle" fill="currentColor" font-size="7.5" font-weight="700" font-family="Segoe UI, sans-serif">HN</text>
            </svg>
            <span class="brand-name">HN Secure Enclave</span>
            <span class="version-pill" id="title-version"></span>
        </div>
        <div class="window-controls">
            <button class="win-btn" id="btn-minimize" title="Minimise" aria-label="Minimise">
                <svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="win-btn" id="btn-maximize" title="Maximise" aria-label="Maximise">
                <svg viewBox="0 0 10 10" id="icon-maximize"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                <svg viewBox="0 0 10 10" id="icon-restore" hidden><path d="M2.5 2.5V0.5h7v7h-2M0.5 2.5h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="win-btn win-close" id="btn-close" title="Close" aria-label="Close">
                <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
            </button>
        </div>
    </header>

    <nav class="tabbar">
        <div class="tab">
            <span class="status-dot" id="tab-dot"></span>
            <span class="tab-label" id="tab-label">Starting…</span>
        </div>
        <button class="settings-btn" id="settings-open">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
        </button>
    </nav>

    <main class="stage">
        <div class="terminal" id="terminal"></div>

        <div class="overlay" id="overlay">
            <!-- Connecting -->
            <section class="card" id="screen-connecting" hidden>
                <div class="spinner"></div>
                <h2>Connecting…</h2>
                <p class="target" data-target></p>
                <div class="actions">
                    <button class="btn btn-ghost" data-action="cancel">Cancel</button>
                </div>
            </section>

            <!-- Password -->
            <section class="card" id="screen-password" hidden>
                <div class="card-icon icon-accent">
                    <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                </div>
                <h2>Enter password</h2>
                <p class="target" data-target></p>
                <form id="password-form" autocomplete="off">
                    <input type="password" id="password-input" class="input" placeholder="Password" spellcheck="false">
                    <p class="form-error" id="password-error" hidden></p>
                    <div class="actions">
                        <button type="button" class="btn btn-ghost" data-action="cancel">Cancel</button>
                        <button type="submit" class="btn btn-primary">Log in</button>
                    </div>
                </form>
            </section>

            <!-- Message (error / disconnected / idle) -->
            <section class="card" id="screen-message" hidden>
                <div class="card-icon" id="message-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
                </div>
                <h2 id="message-title"></h2>
                <p class="message" id="message-text"></p>
                <p class="target" data-target></p>
                <div class="actions">
                    <button class="btn btn-ghost" data-action="settings">Settings</button>
                    <button class="btn btn-primary" id="message-primary" data-action="connect">Connect</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Settings dialog -->
    <div class="modal-backdrop" id="settings-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="modal-header">
                <h2 id="settings-title">Settings</h2>
                <button class="icon-btn" id="settings-close" aria-label="Close settings">&times;</button>
            </div>
            <form id="settings-form" autocomplete="off">
                <div class="modal-body">
                    <div class="field">
                        <label for="set-host">Server IP address</label>
                        <input class="input mono" id="set-host" spellcheck="false" placeholder="217.154.34.205">
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="set-username">Username</label>
                            <input class="input mono" id="set-username" spellcheck="false" placeholder="root">
                        </div>
                        <div class="field field-port">
                            <label for="set-port">Port</label>
                            <input class="input mono" id="set-port" inputmode="numeric" placeholder="22">
                        </div>
                    </div>
                    <p class="form-error" id="settings-error" hidden></p>
                    <p class="hint" id="settings-hint"></p>

                    <div class="divider"></div>

                    <div class="setting-line">
                        <div>
                            <div class="setting-name">Saved host key</div>
                            <div class="setting-desc">Forget it if the server was reinstalled.</div>
                        </div>
                        <button type="button" class="btn btn-small btn-ghost" id="forget-host-key">Forget</button>
                    </div>
                    <div class="setting-line">
                        <div>
                            <div class="setting-name">Version</div>
                            <div class="setting-desc mono" id="settings-version"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="settings-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="settings-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
