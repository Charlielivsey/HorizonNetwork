<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign-in temporarily offline · HN Group</title>
<style>
@font-face{font-family:Jakarta;src:url('/_hn-auth-offline/plus-jakarta-sans.woff2') format('woff2');font-display:swap}
:root{color-scheme:dark;font-family:Jakarta,system-ui,sans-serif;color:#f5efff;background:#100d1c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 50% 0, #30213e66,transparent 65%),#100d1c}
main{width:min(100%,620px);border:1px solid #40334f;border-radius:26px;background:#231b30;overflow:hidden;box-shadow:0 24px 90px #0003}
.stripe{height:5px;background:linear-gradient(90deg,#e97de8 0 14%,#5514b4 14% 28%,#e3e65b 28% 34%,#3e9ba3 34% 54%,#7a1f6c 54% 64%,#c2306b 64% 74%,#5fae7b 74% 87%,#f5efff 87%)}
.content{padding:44px}img{display:block;width:166px;height:auto;margin-bottom:36px}.status{display:inline-flex;align-items:center;gap:9px;color:#c5a4ff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.dot{height:8px;width:8px;border-radius:50%;background:#c5a4ff}
h1{font-size:clamp(28px,5vw,38px);line-height:1.2;letter-spacing:-.04em;margin:16px 0}p{color:#b8abc9;font-size:15px;line-height:1.8;margin:0 0 14px}.contact{display:inline;padding:0;border:0;background:none;color:#c5a4ff;font-size:inherit;text-decoration:underline}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}a{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:#171022;background:#c5a4ff;border:1px solid transparent}a.secondary{background:transparent;border-color:#493a59;color:#e6dbee}a:hover{filter:brightness(1.1)}a:focus-visible{outline:3px solid #e97de8;outline-offset:4px}footer{border-top:1px solid #40334f;padding:18px 44px;color:#b8abc9;font-size:12px}
</style>
</head>
<body>
<main>
<div class="stripe"></div>
<div class="content">
<img src="/_hn-auth-offline/hn-group-wordmark-white.svg" alt="HN Group" width="166" height="58">
<div class="status"><span class="dot"></span>HN Group Auth · Offline</div>
<h1>Sign-in is temporarily offline.</h1>
<p>HN Group Auth is currently unavailable, so we can’t sign you in right now. Please try again shortly.</p>
<p>If you need help, contact <a class="contact" href="mailto:it@hngroup.org.uk">it@hngroup.org.uk</a>.</p>
<div class="actions"><a href="">Try again</a><a class="secondary" href="https://status.hngroup.org.uk">View service status</a></div>
</div>
<footer>HN Group · Keeping our people connected.</footer>
</main>
</body>
</html>
