# Dedicated virtual host. No catch-all or other domain configuration.
server {
    listen 80;
    listen [::]:80;
    server_name auth.hngroup.org.uk;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hn-auth-acme; }
    location / { return 301 https://auth.hngroup.org.uk$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.hngroup.org.uk;
    ssl_certificate /etc/nginx/hn-auth-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/hn-auth-ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hn-auth-acme; }
    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
