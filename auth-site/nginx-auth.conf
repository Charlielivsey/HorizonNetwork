# Dedicated virtual host. No catch-all or other domain configuration.
server {
    listen 80;
    listen [::]:80;
    server_name auth.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/auth-*.conf; # HN website control
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-auth-acme; }
    location / { return 301 https://auth.hngroup.org.uk$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/auth-*.conf; # HN website control
    ssl_certificate /etc/nginx/hn-auth-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/hn-auth-ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    # Auth's fallback is served directly by nginx, even when all PM2 apps are stopped.
    proxy_intercept_errors on;
    error_page 500 502 503 504 =503 /_hn-auth-offline/index.html;
    location = /_hn-auth-offline/index.html {
        internal;
        auth_request off;
        alias /var/www/hn-auth-offline/index.html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }
    location ^~ /_hn-auth-offline/ {
        auth_request off;
        alias /var/www/hn-auth-offline/;
    }
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-auth-acme; }
    # HN Browser profile photo uploads (Auth checks the same 2 MB limit).
    location = /api/native/account/photo {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ^~ /account/ {
        client_max_body_size 3m;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
