server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts.hngroup.org.uk;
    include /etc/nginx/hn-offline/enabled/*.conf; # HN branded offline page
    include /etc/nginx/hn-control/enabled/accounts-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/accounts.hngroup.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.hngroup.org.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-account-web-acme; default_type text/plain; }
    client_max_body_size 3m;
    location / { return 308 https://auth.hngroup.org.uk/account$request_uri; }
}
