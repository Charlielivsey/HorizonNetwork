<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="HN Group App Manager">
  <title>HN Group App Manager</title>
  <!-- HN Group App Manager icon: the HN Group app-icon style (HN purple, white outlines) with four
       app tiles, one of them installing, on the macOS icon grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B24D6"/>
      <stop offset="1" stop-color="#4A0E9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1C2135" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#25064F" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <!-- Four app tiles in the 100-unit grid of the approved company icons; the last one is being installed. -->
  <g transform="translate(160 118) scale(7.0)" filter="url(#soft)">
    <rect x="13" y="13" width="31" height="31" rx="8.5" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="5.2"/>
    <rect x="56" y="13" width="31" height="31" rx="8.5" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="5.2"/>
    <rect x="13" y="56" width="31" height="31" rx="8.5" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="5.2"/>
    <rect x="53.4" y="53.4" width="36.2" height="36.2" rx="10" fill="#FFFFFF"/>
    <path d="M71.5 61.5v16M64.5 71l7 7 7-7" fill="none" stroke="#5514B4" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The HN stripe -->
    <g transform="translate(13 93.6)">
      <rect x="0" y="0" width="9" height="2.6" fill="#E97DE8"/>
      <rect x="9" y="2.6" width="9" height="2.6" fill="#B794F6"/>
      <rect x="18" y="0" width="4" height="2.6" fill="#E3E65B"/>
      <rect x="22" y="2.6" width="13" height="2.6" fill="#3E9BA3"/>
      <rect x="35" y="0" width="7" height="2.6" fill="#E97DE8"/>
      <rect x="42" y="2.6" width="7" height="2.6" fill="#C2306B"/>
      <rect x="49" y="0" width="9" height="2.6" fill="#5FAE7B"/>
      <rect x="58" y="2.6" width="5" height="2.6" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
