server {
    listen 80;
    server_name investors.hngroup.org.uk;
    include /etc/nginx/hn-offline/enabled/*.conf; # HN branded offline page
    include /etc/nginx/hn-control/enabled/investors-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-investors-acme; default_type text/plain; }
    client_max_body_size 128k;
    location / { return 301 https://investors.hngroup.org.uk$request_uri; }
}
