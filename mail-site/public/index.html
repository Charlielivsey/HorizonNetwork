<!doctype html>
<html lang="en-GB" data-hn-reveal=".connect-card"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#5514B4"><title>HN Mail · HN Group</title><link rel="icon" href="/assets/favicon.svg"><link rel="preload" href="/assets/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/mail.css?v=2"><link rel="stylesheet" href="/assets/hn-motion.css"><script src="/assets/hn-motion.js" defer></script><script src="/assets/mail.js?v=2" defer></script></head>
<body class="mail-body"><a class="skip" href="#threads">Skip to your mail</a>
<header class="site-header mail-header" data-hn-header><div class="header-inner mail-header-inner">
  <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Folders" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand" href="#" id="home-link" aria-label="HN Mail inbox"><img class="on-light" src="/assets/brand/hn-group-wordmark.svg" alt="HN Group" width="112" height="39"><img class="on-dark" src="/assets/brand/hn-group-wordmark-white.svg" alt="" width="112" height="39"><span>Mail</span></a>
  <form class="search" id="search" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search-input" type="search" placeholder="Search mail" aria-label="Search mail" autocomplete="off" maxlength="500"><kbd>/</kbd></form>
  <div class="header-account"><button class="account-button" id="account-button" type="button" aria-haspopup="dialog"><img id="account-avatar" src="/api/avatar" alt="" width="36" height="36"><span id="account-name">Your account</span></button></div>
</div></header>
<div class="mail-app" id="app" aria-busy="true">
  <aside class="mail-side" id="side" aria-label="Folders">
    <button class="btn btn-primary compose-btn" id="compose-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>Compose</button>
    <nav id="folders" class="folders"></nav>
    <p class="side-heading" id="labels-heading" hidden>Labels</p>
    <nav id="labels" class="folders labels"></nav>
    <p class="side-note">Your mail stays in Gmail. HN Mail shows it here.</p>
  </aside>
  <section class="mail-list" aria-label="Conversations">
    <div class="list-toolbar">
      <label class="check-all" title="Select all"><input type="checkbox" id="select-all" aria-label="Select all conversations"><span></span></label>
      <div class="bulk" id="bulk" hidden>
        <button class="icon-btn" type="button" data-bulk="archive" title="Archive" aria-label="Archive selected"><svg viewBox="0 0 24 24"><path d="M4 7h16v3H4zM6 10v9h12v-9M10 14h4"/></svg></button>
        <button class="icon-btn" type="button" data-bulk="trash" title="Delete" aria-label="Delete selected"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
        <button class="icon-btn" type="button" data-bulk="read" title="Mark as read" aria-label="Mark selected as read"><svg viewBox="0 0 24 24"><path d="M4 9l8 5 8-5M4 9v10h16V9l-8-5z"/></svg></button>
        <button class="icon-btn" type="button" data-bulk="unread" title="Mark as unread" aria-label="Mark selected as unread"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 6l8 7 8-7"/></svg></button>
      </div>
      <h1 class="list-title" id="list-title">Inbox</h1>
      <span class="list-count" id="list-count"></span>
      <button class="icon-btn" type="button" id="refresh" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
      <button class="icon-btn" type="button" id="prev-page" title="Newer" aria-label="Newer conversations" disabled><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="icon-btn" type="button" id="next-page" title="Older" aria-label="Older conversations" disabled><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <ul class="threads" id="threads" tabindex="-1" aria-live="polite"></ul>
  </section>
  <section class="mail-read" id="reader" aria-label="Conversation" tabindex="-1"><div class="reader-empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 6l8 7 8-7"/></svg><p>Choose a conversation to read it.</p></div></section>
  <section class="connect" id="connect" hidden></section>
</div>
<button class="btn btn-primary compose-fab" id="compose-fab" type="button" aria-label="Compose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>Compose</button>
<footer class="site-footer mail-footer"><div class="stripe hn-stripe-draw" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="footer-inner mail-footer-inner"><div class="footer-brand"><img src="/assets/brand/hn-group-wordmark-white.svg" alt="HN Group" height="24" loading="lazy"></div><nav class="footer-links" aria-label="Footer"><a href="https://sites.hngroup.org.uk/">HN Group Sites</a><a href="https://accounts.hngroup.org.uk/">HN Account</a><a href="https://hngroup.org.uk/privacypolicy">Privacy</a></nav></div></footer>

<div class="composer" id="composer" role="dialog" aria-labelledby="composer-title" hidden>
  <div class="composer-head"><h2 id="composer-title">New message</h2><span class="composer-state" id="composer-state" role="status"></span>
    <button class="icon-btn" type="button" id="composer-min" title="Minimise" aria-label="Minimise"><svg viewBox="0 0 24 24"><path d="M6 15h12"/></svg></button>
    <button class="icon-btn" type="button" id="composer-max" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4"/></svg></button>
    <button class="icon-btn" type="button" id="composer-close" title="Save and close" aria-label="Save draft and close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <form class="composer-body" id="composer-form" autocomplete="off">
    <div class="addr"><label for="c-to">To</label><input id="c-to" name="to" type="text" inputmode="email" autocomplete="email"><button type="button" class="link-btn" id="c-show-cc">Cc Bcc</button></div>
    <div class="addr" id="c-cc-row" hidden><label for="c-cc">Cc</label><input id="c-cc" name="cc" type="text" inputmode="email"></div>
    <div class="addr" id="c-bcc-row" hidden><label for="c-bcc">Bcc</label><input id="c-bcc" name="bcc" type="text" inputmode="email"></div>
    <div class="addr"><label for="c-subject">Subject</label><input id="c-subject" name="subject" maxlength="900"></div>
    <div class="format-bar" role="toolbar" aria-label="Formatting">
      <button type="button" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button><button type="button" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button><button type="button" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
      <button type="button" data-cmd="createLink" title="Link" aria-label="Insert link"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg></button>
      <button type="button" data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button type="button" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5h1v4M4 15h2l-2 3h2"/></svg></button>
      <button type="button" data-cmd="formatBlock" data-value="blockquote" title="Quote" aria-label="Quote"><svg viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-2 5-4 6M15 7h4v4c0 3-2 5-4 6"/></svg></button>
      <button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting"><svg viewBox="0 0 24 24"><path d="M6 5h12M12 5 9 19M5 19l14-14" /></svg></button>
    </div>
    <div class="editor" id="c-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message"></div>
    <ul class="c-files" id="c-files"></ul>
    <p class="form-error" id="c-error" role="alert" hidden></p>
    <div class="composer-actions">
      <button class="btn btn-primary" id="c-send" type="submit">Send</button>
      <label class="icon-btn attach-btn" title="Attach files"><input type="file" id="c-attach" multiple hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 11-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/></svg><span class="sr">Attach files</span></label>
      <span class="spacer"></span>
      <button class="icon-btn" type="button" id="c-discard" title="Discard draft" aria-label="Discard draft"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
    </div>
  </form>
</div>

<dialog id="account" aria-labelledby="account-title"><div class="dialog-heading"><p class="eyebrow">HN GROUP AUTH</p><button type="button" class="icon-btn" data-close="account" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><img class="profile-photo" src="/api/avatar" width="72" height="72" alt="Your profile picture"><h2 id="account-title"></h2><p id="account-email" class="muted"></p><p id="account-gmail" class="muted small"></p><div class="dialog-actions"><a class="btn btn-ghost btn-small" href="https://accounts.hngroup.org.uk/">HN Account ↗</a><button class="btn btn-ghost btn-small" type="button" id="disconnect">Disconnect Gmail</button><form action="/auth/logout" method="post"><button class="btn btn-primary btn-small">Sign out</button></form></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text" class="muted"></p><div class="dialog-actions"><button class="btn btn-ghost" value="cancel" autofocus>Cancel</button><button class="btn btn-primary" value="ok" id="confirm-ok">OK</button></div></form></dialog>
<dialog id="link-dialog" aria-labelledby="link-title"><form method="dialog" id="link-form"><h2 id="link-title">Insert a link</h2><label class="field">Text<input id="link-text" maxlength="300"></label><label class="field">Web address<input id="link-url" type="url" placeholder="https://" required></label><div class="dialog-actions"><button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button><button class="btn btn-primary" value="ok">Insert</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-action" hidden></button></div>
</body></html>
