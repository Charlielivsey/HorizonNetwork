server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name finance.hngroup.org.uk;
    include /etc/nginx/hn-offline/enabled/*.conf; # HN branded offline page
    client_max_body_size 12m;
    include /etc/nginx/hn-control/enabled/finance-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/finance.hngroup.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.hngroup.org.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-finance-acme; default_type text/plain; }
    location / {
        proxy_pass http://127.0.0.1:5690;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
