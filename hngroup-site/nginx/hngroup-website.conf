# HN Group public website — hngroup.org.uk (www.hngroup.org.uk redirects to it).
# Installed by hngroup-site/install.sh as /etc/nginx/sites-available/00-hngroup-website.
#
# Works with or without Cloudflare in front:
#  - HTTPS always has a certificate: Let's Encrypt once issued, a temporary self-signed one until
#    then (Cloudflare's "Full" SSL mode accepts that).
#  - Cloudflare's "Flexible" mode sends HTTPS visitors to port 80; they're served instead of being
#    redirected round in a loop.
#  - /.well-known/acme-challenge/ is answered on both ports, so certificates can be issued and
#    renewed through Cloudflare.

# Port 80: redirect to HTTPS, except certificate checks and visitors who already came in over
# HTTPS through a proxy (Cloudflare Flexible).
map "$http_x_forwarded_proto:$request_uri" $hngroup_http_redirect {
    default 1;
    "~^https:" 0;
    "~^[^:]*:/\.well-known/acme-challenge/" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/website-*.conf; # HN website control

    include /etc/nginx/snippets/hngroup-cloudflare.conf;
    if ($hngroup_http_redirect) {
        return 301 https://hngroup.org.uk$request_uri;
    }
    include /etc/nginx/snippets/hngroup-site.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/website-*.conf; # HN website control

    ssl_certificate /etc/nginx/hngroup-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/hngroup-ssl/privkey.pem;
    include /etc/nginx/snippets/hngroup-cloudflare.conf;
    include /etc/nginx/snippets/hngroup-site.conf;
}

# www: certificate checks are answered, everything else goes to the bare domain.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/website-*.conf; # HN website control

    ssl_certificate /etc/nginx/hngroup-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/hngroup-ssl/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { auth_request off;
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://hngroup.org.uk$request_uri;
    }
}
