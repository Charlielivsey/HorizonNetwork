# The website itself, shared by the HTTP and HTTPS servers in 00-hngroup-website.
# Installed as /etc/nginx/snippets/hngroup-site.conf. The site is plain files in /var/www/hngroup;
# only /api/public/ is passed to the staff portal (open roles, job applications and the contact
# form). Nothing else of the portal is reachable here.

root /var/www/hngroup;
index index.html;
charset utf-8;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

# Let's Encrypt certificate checks (issuing and renewing).
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

# Open roles, job applications (CVs up to 10 MB) and the contact form.
location /api/public/ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
location /api/ {
    return 404;
}

location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

# /privacy serves privacy.html
location / {
    try_files $uri $uri.html $uri/ =404;
}

error_page 404 /404.html;
