# The website itself, shared by the HTTP and HTTPS servers in 00-hngroup-website.
# Installed as /etc/nginx/snippets/hngroup-site.conf. The dedicated website service serves
# public files and forwards only public portal APIs, enforcing maintenance for all content.

root /var/www/hngroup;
index index.html;
charset utf-8;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

# Let's Encrypt certificate checks (issuing and renewing).
location ^~ /.well-known/acme-challenge/ { auth_request off;
    root /var/www/letsencrypt;
    default_type text/plain;
}

# The website service enforces maintenance for pages, assets and public portal APIs.
# Only the certificate challenge above bypasses that gate.
location / {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:3500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
}
