# HN Group public website — hngroup.org.uk (and www.hngroup.org.uk, which redirects to it).
# The site is plain files in /var/www/hngroup. Only /api/public/ is passed to the staff portal
# (open roles, job applications and the contact form); nothing else of the portal is reachable here.
# HTTPS is added to this file automatically by certbot (see install.sh).

server {
    listen 80;
    listen [::]:80;
    server_name www.hngroup.org.uk;
    return 301 $scheme://hngroup.org.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hngroup.org.uk;

    root /var/www/hngroup;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    # Open roles, job applications (CVs up to 10 MB) and the contact form.
    location /api/public/ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
