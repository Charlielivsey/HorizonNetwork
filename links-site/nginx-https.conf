server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name links.hngroup.org.uk;
    ssl_certificate /etc/letsencrypt/live/links.hngroup.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/links.hngroup.org.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hn-links-acme; default_type text/plain; }
    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
