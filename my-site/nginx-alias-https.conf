server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name my.horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/my-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/my.horizonetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.horizonetwork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-my-acme; default_type text/plain; }
    location / { return 301 https://my.horizonetwork.com$request_uri; }
}
