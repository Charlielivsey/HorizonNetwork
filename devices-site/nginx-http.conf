server {
    listen 80;
    listen [::]:80;
    server_name devices.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/devices-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-devices-acme; default_type text/plain; }
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }
}
