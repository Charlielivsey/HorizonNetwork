server {
    listen 80;
    listen [::]:80;
    server_name panel.horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/panel-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-panel-acme; default_type text/plain; }
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
# Alias: redirects to the primary hostname.
server {
    listen 80;
    listen [::]:80;
    server_name panel.horizonetwork.com;
    include /etc/nginx/hn-control/enabled/panel-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-panel-acme; default_type text/plain; }
    location / { return 301 https://panel.horizon-network.co.uk$request_uri; }
}
