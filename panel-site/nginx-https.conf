server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/panel-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/panel.horizon-network.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.horizon-network.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-panel-acme; default_type text/plain; }
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
