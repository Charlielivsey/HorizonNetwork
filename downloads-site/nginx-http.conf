server {
    listen 80;
    listen [::]:80;
    server_name downloads.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/downloads-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-downloads-acme; default_type text/plain; }
    client_max_body_size 16k;
    proxy_buffering off;
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
