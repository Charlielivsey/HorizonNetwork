# network.hngroup.org.uk: the Horizon Network website (PM2 hn-network, loopback 3600).
server {
    listen 80;
    listen [::]:80;
    server_name network.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/network-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-network-acme; default_type text/plain; }
    location / { return 301 https://network.hngroup.org.uk$request_uri; }
}
