# Dedicated Horizon Network host. Other sites and the catch-all are untouched.
server {
    listen 80;
    listen [::]:80;
    server_name horizon-network.co.uk www.horizon-network.co.uk;
    location ^~ /.well-known/acme-challenge/ {
        # Use the directly routed www host for ACME checks through Cloudflare.
        if ($host = horizon-network.co.uk) { return 302 http://www.horizon-network.co.uk$request_uri; }
        root /var/www/hn-network-acme;
        default_type text/plain;
    }
    location / { return 301 https://horizon-network.co.uk$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name horizon-network.co.uk;
    ssl_certificate /etc/nginx/hn-network-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/hn-network-ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location ^~ /.well-known/acme-challenge/ {
        # Use the directly routed www host for ACME checks through Cloudflare.
        if ($host = horizon-network.co.uk) { return 302 http://www.horizon-network.co.uk$request_uri; }
        root /var/www/hn-network-acme;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.horizon-network.co.uk;
    ssl_certificate /etc/nginx/hn-network-ssl/www-fullchain.pem;
    ssl_certificate_key /etc/nginx/hn-network-ssl/www-privkey.pem;
    location ^~ /.well-known/acme-challenge/ {
        # Use the directly routed www host for ACME checks through Cloudflare.
        if ($host = horizon-network.co.uk) { return 302 http://www.horizon-network.co.uk$request_uri; }
        root /var/www/hn-network-acme;
        default_type text/plain;
    }
    location / { return 301 https://horizon-network.co.uk$request_uri; }
}
