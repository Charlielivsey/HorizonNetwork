# Horizon Network moved to network.hngroup.org.uk (the user's request, 30 October 2026). The old addresses keep their
# certificates and send every page to the same page at the new address. Other sites and the catch-all are untouched.
server {
    listen 80;
    listen [::]:80;
    server_name horizon-network.co.uk www.horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/network-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off;
        # Use the directly routed www host for ACME checks through Cloudflare.
        if ($host = horizon-network.co.uk) { return 302 http://www.horizon-network.co.uk$request_uri; }
        root /var/www/hn-network-acme;
        default_type text/plain;
    }
    location / { return 301 https://network.hngroup.org.uk$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/network-*.conf; # HN website control

    ssl_certificate /etc/nginx/hn-network-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/hn-network-ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { auth_request off;
        if ($host = horizon-network.co.uk) { return 302 http://www.horizon-network.co.uk$request_uri; }
        root /var/www/hn-network-acme;
        default_type text/plain;
    }
    location / { return 301 https://network.hngroup.org.uk$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/network-*.conf; # HN website control

    ssl_certificate /etc/nginx/hn-network-ssl/www-fullchain.pem;
    ssl_certificate_key /etc/nginx/hn-network-ssl/www-privkey.pem;
    location ^~ /.well-known/acme-challenge/ { auth_request off;
        root /var/www/hn-network-acme;
        default_type text/plain;
    }
    location / { return 301 https://network.hngroup.org.uk$request_uri; }
}
