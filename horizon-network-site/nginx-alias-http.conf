# horizonetwork.com: a former address of Horizon Network, redirected to network.hngroup.org.uk.
server {
    listen 80;
    listen [::]:80;
    server_name horizonetwork.com www.horizonetwork.com;
    include /etc/nginx/hn-control/enabled/network-*.conf; # HN website control

    client_max_body_size 32k;
    location ^~ /.well-known/acme-challenge/ { auth_request off;
        root /var/www/hn-network-com-acme;
        default_type text/plain;
    }
    location / { return 301 https://network.hngroup.org.uk$request_uri; }
}
