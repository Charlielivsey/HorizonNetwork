<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HN Group Contracts</title>
<meta name="description" content="Send contracts for signing and sign the ones sent to you, with your HN Group Auth account.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/contracts.css?v=1">
<script src="/assets/contracts.js?v=1" defer></script>
</head>
<body>
<header class="top">
 <div class="wrap top-inner">
  <a class="brand" href="/"><img class="on-light" src="/assets/brand/hn-group-wordmark.svg" alt="HN Group" width="118" height="41"><img class="on-dark" src="/assets/brand/hn-group-wordmark-white.svg" alt="" width="118" height="41"><span class="brand-name">Contracts</span></a>
  <nav class="nav" id="nav" aria-label="Contracts">
   <a href="/" data-view="home"><span class="label">To sign</span><span class="count" id="count-to-sign" hidden></span></a>
   <a href="/signed" data-view="signed"><span class="label">Signed</span></a>
   <a href="/sent" data-view="sent" data-sender hidden><span class="label">Sent</span></a>
   <a href="/all" data-view="all" data-manager hidden><span class="label">All contracts</span></a>
  </nav>
  <div class="who" id="who" hidden>
   <a class="btn primary small" href="/new" data-sender hidden>New contract</a>
   <span class="avatar" id="who-avatar"></span><span class="who-text"><strong id="who-name"></strong><small id="who-role"></small></span>
   <form method="post" action="/auth/logout"><button class="btn small ghost" type="submit">Sign out</button></form>
  </div>
 </div>
 <div class="stripe" aria-hidden="true"></div>
</header>
<main class="wrap" id="main" aria-live="polite"></main>
<div class="layer" id="layer" hidden><div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><h2 id="sheet-title"></h2><p id="sheet-text"></p><div id="sheet-extra"></div><div class="sheet-actions"><button class="btn" type="button" data-close id="sheet-cancel">Cancel</button><button class="btn primary" type="button" id="sheet-ok">OK</button></div></div></div>
</body>
</html>
