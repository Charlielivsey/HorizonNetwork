server {
    listen 80;
    server_name companies.hngroup.org.uk;
    include /etc/nginx/hn-offline/enabled/*.conf; # HN branded offline page
    include /etc/nginx/hn-control/enabled/companies-*.conf; # HN website control

    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-companies-acme; default_type text/plain; }
    client_max_body_size 16m;
    location / { return 301 https://companies.hngroup.org.uk$request_uri; }
}
