server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name horizonadvertising.co.uk;
    include /etc/nginx/hn-control/enabled/advertising-*.conf; # HN website control

    ssl_certificate /etc/nginx/ha-website-ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ha-website-ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/ha-website-acme; default_type text/plain; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
