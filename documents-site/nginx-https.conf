server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name documents.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/documents-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/documents.hngroup.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/documents.hngroup.org.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-documents-acme; default_type text/plain; }
    client_max_body_size 1200k;
    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
