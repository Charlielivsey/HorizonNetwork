# Static fallback needs neither the application nor central website control.
proxy_intercept_errors on;
error_page 500 502 503 504 =503 /__hn_offline/index.html;
location = /__hn_offline/index.html {
    internal;
    auth_request off;
    alias /var/www/hn-offline/$host/index.html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
}
location ^~ /__hn_offline/assets/ {
    auth_request off;
    alias /var/www/hn-offline/assets/;
}
