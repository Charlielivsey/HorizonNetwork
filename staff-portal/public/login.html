<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in · HN Group Staff Portal</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/theme-boot.js"></script>
</head>
<body class="login-page">
    <main class="login-wrap">
        <div class="login-card">
            <div class="brand brand-lg">
                <img src="/assets/hn-group-logo.png" alt="HN Group" class="brand-logo logo-light-theme">
            <img src="/assets/hn-group-logo-white.png" alt="HN Group" class="brand-logo logo-dark-theme">
                <span class="brand-sub">Staff Portal</span>
            </div>

            <h1>Sign in</h1>
            <p class="muted">Sign in with your work email address.</p>

            <form id="login-form" novalidate>
                <label for="username">Email</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">Show</button>
                </div>

                <div class="form-error" id="login-error" role="alert" hidden></div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
            </form>

            <p class="login-foot muted">Having trouble signing in? Contact the IT team.</p>
        </div>
        <p class="legal">Authorised HN Group staff only. Activity on this system is logged.</p>
    </main>
    <script src="/assets/login.js"></script>
</body>
</html>
