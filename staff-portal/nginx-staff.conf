# HN Group Staff Portal — staff.hngroup.org.uk
# install.sh turns this into the HTTPS site (plus a port 80 redirect) once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name staff.hngroup.org.uk;
    include /etc/nginx/hn-control/enabled/staff-*.conf; # HN website control


    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
