name: Build HN Secure Network for Windows
# Builds the Windows installer and publishes it for downloads.hngroup.org.uk and the in-app updater.
# Tests run before pushing (npm test and npm run test:desktop in windows-vpn-app); GitHub only builds and publishes.
on:
  push:
    branches: [claude/confident-volta-gxjboo]
    paths: ['windows-vpn-app/**', '.github/workflows/windows-vpn-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secure-network-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: windows-vpn-app/package-lock.json}
      - run: npm ci
        working-directory: windows-vpn-app
      - run: npm run icons
        working-directory: windows-vpn-app
      - name: Build the SSH window (HN Secure Network SSH.exe)
        run: npm run ssh-helper
        working-directory: windows-vpn-app
      - name: Record the build number
        shell: bash
        run: node -e "require('fs').writeFileSync('src/build.json', JSON.stringify({build:Number(process.env.GITHUB_RUN_NUMBER)}))"
        working-directory: windows-vpn-app
      - name: Build the installer
        shell: bash
        run: npx electron-builder --win --x64 --publish never -c.buildVersion=${{ github.run_number }}
        working-directory: windows-vpn-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: secure-network-windows
          path: windows-vpn-app/dist/HN-Secure-Network-*-windows-x64.exe
          if-no-files-found: error
      - name: Check the installer carries the SSH window
        shell: bash
        run: test -f "dist/win-unpacked/resources/ssh/HN Secure Network SSH.exe"
        working-directory: windows-vpn-app
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: secure-network-windows, path: installer}
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./windows-vpn-app/package.json').version")
          TAG="secure-network-windows-v$VERSION-$GITHUB_RUN_NUMBER"; NAME="HN-Secure-Network-$VERSION-windows-x64.exe"
          test -f "installer/$NAME"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "HN Secure Network $VERSION for Windows · build $GITHUB_RUN_NUMBER" --notes 'HN Secure Network for Windows 10 and 11 (64-bit): the HN Group VPN (connect with your PIN) and SSH sessions to the HN Group server in their own terminal window. For HN Group staff; sign in with your HN Group account. It installs WireGuard for Windows if needed and keeps itself up to date. Preview builds are not code-signed yet.' "installer/$NAME"
          # downloads.hngroup.org.uk (and so the in-app updater) finds this build from this record.
          TAG="$TAG" NAME="$NAME" VERSION="$VERSION" node -e "const fs=require('fs'),crypto=require('crypto');const data=fs.readFileSync('installer/'+process.env.NAME);fs.writeFileSync('downloads-site/secure-network-windows.json',JSON.stringify({tag:process.env.TAG,version:process.env.VERSION,build:Number(process.env.GITHUB_RUN_NUMBER),publishedAt:new Date().toISOString(),asset:{name:process.env.NAME,size:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex')}},null,1));"
          cat downloads-site/secure-network-windows.json
      - name: Record the build for downloads.hngroup.org.uk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads-site/secure-network-windows.json
          git commit -m "Publish HN Secure Network for Windows $(node -p "require('./downloads-site/secure-network-windows.json').version") (build $GITHUB_RUN_NUMBER, ${GITHUB_SHA::7})"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
