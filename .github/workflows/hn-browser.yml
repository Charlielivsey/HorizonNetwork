name: Build and publish HN Browser
on:
  push:
    branches: [claude/confident-volta-gxjboo]
    paths: ['browser-app/**', '.github/workflows/hn-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hn-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Tests run before pushing (npm test and npm run test:desktop in browser-app); GitHub only builds and publishes.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, platform: mac, arch: arm64}
          - {os: windows-latest, platform: win, arch: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: browser-app/package-lock.json}
      - run: npm ci
        working-directory: browser-app
      - run: npm run icons
        working-directory: browser-app
      - name: Record version and build number
        shell: bash
        run: node -e "require('fs').writeFileSync('src/build.json', JSON.stringify({build:Number(process.env.GITHUB_RUN_NUMBER)}))"
        working-directory: browser-app
      - name: Build installer
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never -c.buildVersion=${{ github.run_number }}
        working-directory: browser-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            browser-app/dist/*.dmg
            browser-app/dist/*.zip
            browser-app/dist/*.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'browser-*', path: installers, merge-multiple: true}
      - name: Publish preview installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./browser-app/package.json').version")
          TAG="browser-v$VERSION-${{ github.run_number }}"
          cd installers
          sha256sum HN-Browser-* > SHA256SUMS.txt
          # release.json lets downloads.hngroup.org.uk (and so the in-app updater) find this release without
          # GitHub's rate-limited API: it's attached to the release and committed to downloads-site/release.json.
          TAG="$TAG" node -e "const fs=require('fs'),crypto=require('crypto');const ids={'mac-arm64':/-mac-arm64\.dmg$/,'windows-x64':/-win-x64\.exe$/,'mac-arm64-zip':/-mac-arm64\.zip$/};const assets={};for(const name of fs.readdirSync('.').filter(f=>f.startsWith('HN-Browser-')))for(const[id,re]of Object.entries(ids))if(re.test(name)){const data=fs.readFileSync(name);assets[id]={name,size:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex')};}if(!assets['mac-arm64']||!assets['windows-x64'])throw Error('Missing installers');fs.writeFileSync('release.json',JSON.stringify({tag:process.env.TAG,publishedAt:new Date().toISOString(),assets},null,1));"
          cat release.json
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HN Browser $VERSION · preview build ${{ github.run_number }}" --prerelease --notes 'HN Browser 1.0: rebuilt workspace and start page, synchronized live themes, SSH terminal for the HN server through HN VPN, connection diagnostics, draggable tabs and preserved account, profile, settings, history, bookmarks, downloads and in-place updates. macOS Apple silicon and Windows x64 only. Preview builds are not developer-signed or notarised. Real WireGuard control needs platform validation.' HN-Browser-* SHA256SUMS.txt release.json
      - name: Record the release for downloads.hngroup.org.uk
        run: |
          cp installers/release.json downloads-site/release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads-site/release.json
          git commit -m "Record HN Browser $(node -p "require('./downloads-site/release.json').tag") for the downloads site"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
