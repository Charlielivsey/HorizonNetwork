name: Build HN Group VPN for Mac
on:
  push:
    paths: ['mac-vpn-app/**', '.github/workflows/mac-vpn-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: bash mac-vpn-app/build.sh
      - name: Check the app
        run: |
          APP="mac-vpn-app/build/HN Group VPN.app"
          lipo -archs "$APP/Contents/MacOS/HNGroupVPN"
          codesign --verify --deep "$APP"
          plutil -lint "$APP/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: HN-Group-VPN-macOS
          path: mac-vpn-app/build/HN-Group-VPN-macOS.zip
          retention-days: 90
      # The VPN website serves the latest build: vpn-site/install.sh publishes this copy.
      - name: Publish the build for the VPN website
        run: |
          mkdir -p vpn-site/mac-app
          cp mac-vpn-app/build/HN-Group-VPN-macOS.zip vpn-site/mac-app/HN-Group-VPN-macOS.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vpn-site/mac-app/HN-Group-VPN-macOS.zip
          git commit -m "Publish the HN Group VPN Mac app (build ${GITHUB_SHA::7})"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
