name: Build HN Group App Manager
on:
  push:
    branches: [claude/confident-volta-gxjboo]
    paths: ['app-manager/**', '.github/workflows/app-manager.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hn-app-manager-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: mac, arch: universal}
          - {os: windows-latest, target: win, arch: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: app-manager/package-lock.json}
      - run: npm ci
        working-directory: app-manager
      - run: npm test
        working-directory: app-manager
      - run: npm run icons
        working-directory: app-manager
      - name: Record build number
        shell: bash
        run: node -e "require('fs').writeFileSync('src/build.json',JSON.stringify({build:Number(process.env.GITHUB_RUN_NUMBER)}))"
        working-directory: app-manager
      - name: Build installers
        shell: bash
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never -c.buildVersion=${{ github.run_number }}
        working-directory: app-manager
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: manager-${{ matrix.target }}
          path: |
            app-manager/dist/HN-Group-App-Manager-*.zip
            app-manager/dist/HN-Group-App-Manager-*.dmg
            app-manager/dist/HN-Group-App-Manager-*.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'manager-*', merge-multiple: true, path: installers}
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app-manager/package.json').version")
          TAG="app-manager-v$VERSION-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "HN Group App Manager $VERSION · build $GITHUB_RUN_NUMBER" --notes 'HN Group App Manager: install, update, reinstall and remove HN Browser and HN Secure Network from verified downloads, change their settings, update all at once, and keep App Manager itself up to date. For Apple silicon/Intel Macs and Windows x64 (HN Browser needs Apple silicon). Preview installers are not yet developer-signed or notarised.' installers/*
          VERSION="$VERSION" TAG="$TAG" node app-manager/scripts/manifest.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads-site/app-manager-mac.json downloads-site/app-manager-windows.json
          git commit -m "Publish HN Group App Manager $VERSION (build $GITHUB_RUN_NUMBER)"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 5
          done
          exit 1
