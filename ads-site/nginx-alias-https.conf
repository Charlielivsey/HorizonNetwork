server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ads.horizon-network.co.uk;
    include /etc/nginx/hn-control/enabled/ads-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/ads.horizonetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ads.horizonetwork.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-ads-acme; default_type text/plain; }
    location / { return 301 https://ads.horizonetwork.com$request_uri; }
}
