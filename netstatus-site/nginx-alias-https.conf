server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.horizonetwork.com;
    include /etc/nginx/hn-control/enabled/netstatus-*.conf; # HN website control

    ssl_certificate /etc/letsencrypt/live/status.horizon-network.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.horizon-network.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location ^~ /.well-known/acme-challenge/ { auth_request off; root /var/www/hn-netstatus-acme; default_type text/plain; }
    location / { return 301 https://status.horizon-network.co.uk$request_uri; }
}
